# Isaac Sim (Isaac Lab) environment for SimToolReal — Python 3.11, separate from the
# Python 3.8 Isaac Gym environment defined by the root pyproject.toml.
#
# Install / update (from the repo root):
#
#   UV_PROJECT_ENVIRONMENT="$PWD/.venv_isaacsim" uv sync --project envs/isaacsim
#
# See docs/isaacsim_installation.md.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "simtoolreal-isaacsim"
version = "0.1.0"
description = "Isaac Sim / Isaac Lab environment for SimToolReal"
requires-python = "==3.11.*"
dependencies = [
    # PyTorch for CUDA 12.6 (Isaac Sim 5.1 pins these exact versions)
    "torch==2.7.0",
    "torchvision==0.22.0",
    "torchaudio==2.7.0",
    # Isaac Lab + Isaac Sim. Keep the pin exact: newer Isaac Lab releases change the
    # DirectRLEnv / UrdfConverter APIs that isaacsimenvs depends on.
    "isaaclab[isaacsim,all]==2.3.2.post1",
    # Vendored rl_games + inference deps
    "rl-games",
    "omegaconf",
    "hydra-core",
    "gym==0.23.1",
    "scipy",
    "numpy",
    "yourdfpy",
    "requests",
    "tqdm",
    "tyro",
    "imageio[ffmpeg]",
    "wandb",
    "termcolor",
    # Offline collision decomposition (dextoolbench/generate_collision_meshes.py)
    "coacd",
]

# Repo-local packages, installed editable. The root pyproject.toml can't be used as a
# dependency here: it describes the Python 3.8 Isaac Gym environment and its pins
# (numpy==1.23.0, warp-lang==0.10.1, isaacgym-stubs, ...) conflict with Isaac Sim.
# Keep this list in sync with [tool.setuptools.packages.find] in the root pyproject.toml.
[tool.setuptools]
packages = [
    "isaacgymenvs",
    "isaacsimenvs",
    "dextoolbench",
    "deployment",
    "baselines",
    "recorded_data",
    "simtoolreal_shared",
]

[tool.setuptools.package-dir]
isaacgymenvs = "../../isaacgymenvs"
isaacsimenvs = "../../isaacsimenvs"
dextoolbench = "../../dextoolbench"
deployment = "../../deployment"
baselines = "../../baselines"
recorded_data = "../../recorded_data"
simtoolreal_shared = "../../simtoolreal_shared"

[tool.uv]
# Isaac Sim only ships Linux x86_64 wheels for this setup; don't lock for other platforms.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# isaacsim-kernel pins typing_extensions==4.12.2, but tyro.cli needs NoExtraItems from
# typing_extensions>=4.13. Newer typing_extensions works with isaaclab 2.3.2.post1.
override-dependencies = ["typing-extensions>=4.13"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
rl-games = { path = "../../rl_games", editable = true }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
